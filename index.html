<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login · Sistem Informasi Sekolah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0b2b40 0%, #1a4a62 50%, #2d6f8a 100%);
            padding: 1.5rem;
            position: relative;
        }
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 500px;
            height: 500px;
            background: rgba(249, 184, 27, 0.08);
            border-radius: 50%;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            pointer-events: none;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 2rem;
            padding: 2.5rem 2.8rem 2.8rem 2.8rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: relative;
            z-index: 2;
        }
        .login-card .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-card .logo-area h1 {
            font-weight: 700;
            font-size: 1.6rem;
            color: #0b2b40;
            letter-spacing: -0.02em;
            margin-bottom: 0.2rem;
        }
        .login-card .logo-area h1 i { color: #f9b81b; }
        .login-card .logo-area p {
            color: #4f6f82;
            font-size: 0.9rem;
            font-weight: 500;
            margin: 0;
        }
        .login-card .logo-area .line-decoration {
            width: 60px;
            height: 3px;
            background: #f9b81b;
            margin: 0.6rem auto 0 auto;
            border-radius: 10px;
        }
        .login-card .input-group-custom {
            position: relative;
            margin-bottom: 1.2rem;
        }
        .login-card .input-group-custom .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #7a9bb0;
            font-size: 1.1rem;
            z-index: 4;
        }
        .login-card .input-group-custom input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            border: 2px solid #e2ebf3;
            border-radius: 1rem;
            font-size: 0.95rem;
            background: #f8fafc;
            transition: 0.15s;
            color: #0b2b40;
            font-weight: 500;
        }
        .login-card .input-group-custom input:focus {
            outline: none;
            border-color: #f9b81b;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(249, 184, 27, 0.12);
        }
        .login-card .input-group-custom input::placeholder {
            color: #a5bccd;
            font-weight: 400;
            font-size: 0.9rem;
        }
        .login-card .btn-login {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 1rem;
            background: linear-gradient(145deg, #0b2b40, #1a4055);
            color: white;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.15s;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 6px 16px rgba(11, 43, 64, 0.25);
        }
        .login-card .btn-login:hover {
            background: linear-gradient(145deg, #123d55, #1f4f68);
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(11, 43, 64, 0.3);
        }
        .login-card .register-link {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: #4f6f82;
        }
        .login-card .register-link a {
            color: #0b2b40;
            font-weight: 600;
            text-decoration: none;
            transition: 0.15s;
        }
        .login-card .register-link a:hover {
            color: #f9b81b;
            text-decoration: underline;
        }
        .login-card .alert {
            border-radius: 1rem;
            font-size: 0.85rem;
            padding: 0.6rem 1rem;
        }
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid #e4edf5;
        }
        .social-links a {
            color: #5a7d92;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 500;
            transition: 0.15s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .social-links a:hover { color: #0b2b40; }
        .social-links a i { font-size: 1.1rem; }
        @media (max-width: 480px) {
            .login-card { padding: 2rem 1.5rem; }
            .login-card .logo-area h1 { font-size: 1.3rem; }
            .social-links { flex-wrap: wrap; gap: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-area">
            <h1><i class="bi bi-mortarboard-fill"></i> SISFO</h1>
            <p>Sistem Informasi Sekolah</p>
            <div class="line-decoration"></div>
        </div>

        <!-- Alert notifikasi -->
        <div id="alertMessage" class="alert d-none" role="alert"></div>

        <form id="loginForm">
            <div class="input-group-custom">
                <span class="input-icon"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username" placeholder="Masukkan username" required />
            </div>
            <div class="input-group-custom">
                <span class="input-icon"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Masukkan password" required />
            </div>
            <button type="submit" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i> LOGIN
            </button>
        </form>

        <div class="register-link">
            Belum punya akun? <a href="register.html">Daftar di sini</a>
        </div>

        <div class="social-links">
            <a href="#" target="_blank"><i class="bi bi-linkedin"></i> LinkedIn</a>
            <a href="#" target="_blank"><i class="bi bi-instagram"></i> Instagram</a>
            <a href="#" target="_blank"><i class="bi bi-twitter-x"></i> Twitter</a>
        </div>
        <div style="text-align: center; margin-top: 1.2rem; font-size: 0.7rem; color: #8aaec2;">
            SMK Pawiytan Surabaya &bull; Project Praktik
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const alertEl = document.getElementById('alertMessage');

            if (!username || !password) {
                showAlert('Username dan password harus diisi!', 'danger');
                return;
            }

            // Ambil data user dari LocalStorage
            const users = JSON.parse(localStorage.getItem('users')) || [];

            // Cari user dengan username dan password yang cocok
            const foundUser = users.find(user => 
                user.username === username && user.password === password
            );

            if (foundUser) {
                // Login berhasil
                localStorage.setItem('currentUser', JSON.stringify(foundUser));
                showAlert('Login berhasil! Selamat datang ' + foundUser.fullname, 'success');
                
                // Redirect ke dashboard setelah 1.5 detik
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
            } else {
                // Cek apakah username terdaftar
                const userExists = users.some(user => user.username === username);
                if (userExists) {
                    showAlert('Password salah!', 'danger');
                } else {
                    showAlert('Username tidak terdaftar! Silakan daftar terlebih dahulu.', 'danger');
                }
            }
        });

        function showAlert(message, type) {
            const alertEl = document.getElementById('alertMessage');
            alertEl.textContent = message;
            alertEl.className = `alert alert-${type}`;
            alertEl.classList.remove('d-none');
            
            setTimeout(() => {
                alertEl.classList.add('d-none');
            }, 5000);
        }
    </script>
</body>
</html>
